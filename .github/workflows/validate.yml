name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Schema validation
        run: planscope validate

      - name: Tests
        run: pytest

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Export site data from repository YAML
        run: planscope export-site-data

      - name: Set Pages base path
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "PLANSCOPE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "PLANSCOPE_BASE=/$repo/" >> "$GITHUB_ENV"
          fi

      - name: Build static site
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build

      - name: Verify static build output
        run: test -f site/dist/index.html
