# Push-triggered deploy: keeps the live Pages site in sync with main.
# There is no scheduled job in this repo — deployment happens on push (or manual
# workflow_dispatch) only. This workflow never writes to the repository.
name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "config/**"
      - "schemas/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time (no overlap on the github-pages environment).
concurrency:
  group: planscope-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Validate data
        run: planscope validate

      - name: Run Python tests
        run: pytest

      - name: Export site data from repository YAML
        run: planscope export-site-data

      - name: Set Pages base path
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "PLANSCOPE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "PLANSCOPE_BASE=/$repo/" >> "$GITHUB_ENV"
          fi

      - name: Build static site
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
