# One-shot manual deploy for the initial GitHub Pages release.
# TEMPORARY: delete after the first successful deployment.
# (daily-refresh.yml stays schedule-only by design — see tests/test_workflows.py.)
name: deploy-pages-once

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: planscope-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Validate
        run: planscope validate

      - name: Export site data
        run: planscope export-site-data

      - name: Set Pages base path
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "PLANSCOPE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "PLANSCOPE_BASE=/$repo/" >> "$GITHUB_ENV"
          fi

      - name: Build static site
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build

      - name: Verify build output
        run: test -f site/dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
