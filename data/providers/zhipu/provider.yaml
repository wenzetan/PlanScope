quota_policies:
  - generation: current       # GLM Coding Plan 现行积分制（credits）体系
    coding_weekly_limit:
      enabled: true
      window_days: 7
      note: 官方当前文档：Lite / Pro / Max 三档均为 5 小时 + 7 天双层窗口
    coding_rolling_limit:
      enabled: true
      window_hours: 5
      exact_amount_public: true   # 三档 5 小时积分额度官方直接公布
    credit_system:
      enabled: true
      accounting_unit: credits
      formula: >-
        credits = (input_tokens * input_multiplier
        + cached_input_tokens * cached_input_multiplier
        + output_tokens * output_multiplier) / 10000
      formula_divisor: 10000
      model_credit_multipliers:
        - model: glm-5.3
          input: 6.9
          cached_input: 1.7
          output: 24
        - model: glm-5.3-flash
          input: 2.3
          cached_input: 0.56
          output: 8
      off_peak_multiplier: 0.5     # 非高峰 0.5×，即同等积分理论容量约 2×
      peak_window:
        timezone: UTC+8
        weekdays:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
        start: "14:00"
        end: "18:00"
      mcp_credit_costs:
        - tool: web_search
          credits_per_call: 1.2
        - tool: web_reader
          credits_per_call: 1.2
        - tool: zread
          credits_per_call: 1.2
        - tool: vision_understanding
