        高峰（周一至周五 14:00–18:00 UTC+8）按 1× 计；其他时间为非高峰 0.5×。
        旧版按 prompts / 旧价格计量，另行 legacy 记录，不与本代系混写。
    note: 现行 credit 制：5 小时滚动窗口 + 7 天窗口，两窗口并行
