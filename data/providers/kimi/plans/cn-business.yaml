  online_purchase: true
  sales_assisted_purchase: true

pricing:
  currency: CNY
  monthly: null                        # 仅年付，无月付
  annual:
    amount: 4200                       # ¥4,200 / 席 / 年（billing_model: per_seat）
    origin: official
    billing_period: year
    billing_model: per_seat
    effective_monthly: 350             # 月均等效 ¥350 / 席 / 月
    effective_monthly_origin: official
    note: 单价按席位计；团队总成本 = 4200 × seat_count（派生，见 Pricing 页计算器）
  monthly_billing_available: false     # 官方明确：不支持月付
  seats:
    minimum:
      value: 2                         # 2 席起购（见 evidence_conflicts：旧文案写 5 席）
      origin: official
    maximum_per_purchase:
      value: 150
      origin: official
    minimum_order:
      amount: 8400
      currency: CNY
      origin: official
      note: 2 席 × 4200 = ¥8,400/年（官方专页直出）
  discounts:
    publicly_available: false          # 官方称暂无折扣
    note: null
  additional_seats:
    supported: true                    # 订阅期内可增购
    prorated: true
    proration_basis: remaining_days    # 按购买日至现有订阅到期日的剩余天数计价
    expiry_alignment: original_subscription_end   # 新增席位与原订阅统一到期
  tax:
    included: unknown                  # 税费是否含入价内：未核实
  invoices:
