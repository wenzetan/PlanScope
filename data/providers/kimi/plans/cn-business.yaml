notes: >-
  ① **单一 Plan × seat 数量**：seat 是 pricing quantity 不是 tier —— 不创建
  business-2-seat / business-5-seat 等文件；2/5/10/20/50/150 席成本全部由
  4200 × N 在展示层派生（Pricing 页席位计算器）。
  ② **Business 系列 ≠ API 系列**：Kimi Business（席位、给员工/团队）与
  Kimi API（PAYG / 企业合同、给业务系统）是不同产品线；Kimi API Enterprise
  后续单独调研，不并入本文件，也不做「Kimi Enterprise 下挂两 tier」的结构。
  ③ **不训练 ≠ ZDR**：企业承诺不用于训练是官方事实，但 ZDR / 保留期 /
  subprocessor 未公开 —— 保持 unknown，绝不从「不训练」推导 ZDR=true
  （见 privacy/business.yaml）。
  ④ **Kimi Code 谨慎处理**：权益 included + 企业用途 supported 是官方事实；
  但第三方 agent（Claude Code / OpenCode / Codex / Hermes）、API Key、
  逐模型矩阵全部 unknown —— 不继承个人版数据（missing_fields 显式列出）。
  ⑤ **年付 ≠ 年度发额度**：billing 按年、成员额度 monthly refresh，页面需分开显示。
  ⑥ 席位增购按剩余天数 prorate、与原订阅统一到期；移除成员席位下一计费周期释放。
  ⑦ 各来源 URL 待补（Business 专页 / FAQ / 权益与价格页）。
