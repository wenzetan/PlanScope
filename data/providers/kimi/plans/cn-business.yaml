  refresh_enabled: true
  refresh_period: monthly              # 年付 ≠ 年度一次性发额度：billing 按年、额度按月刷新
  new_member_full_quota: true          # 新成员获得当期完整额度，不按加入日期按比例缩减
  removed_member_immediate_loss: true  # 成员移除后立即失去权益（席位下一计费周期释放）
  shared_pool_enabled: null            # 是否跨功能共享池：未核实
  shared_pool_refresh: null
  shared_pool_rollover: null
  accounting_basis: null               # 未在公开资料确认，不沿用个人版 token_usage
  weekly_quota_enabled: null           # Business 的 Kimi Code 是否有周额度：未核实
  rolling_windows: null                # 滚动窗口机制未核实（missing_fields: exact_kimi_code_quota）
  daily: null
  weekly: null
  monthly: null                        # exact monthly credit 未公开（public: false）
  burst: null
  rpm: null
  tpm: null
  concurrency: null
  usage_policy: null
  limit_type: unknown
  actual_limit_known: false
