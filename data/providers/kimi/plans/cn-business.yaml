# Kimi Business —— 中国大陆**单一**企业套餐，按席位线性扩展。
# seat count 是 pricing quantity，不是 plan tier：绝不创建 cn-business-2-seat 等档位文件。
# 与 Kimi API 系列（PAYG / 企业合同）分属不同产品线，后续独立调研，不并入本文件。
id: cn-business
name: Kimi Business
provider: kimi
record_kind: subscription
type:
  - agent_plan
  - coding_plan             # subscription → plan_family；team 维度 → audience: business
status: active
plan_family: business
generation: current
positioning: null           # 业务套餐，不属于个人会员 everyday..premium 档位梯子
