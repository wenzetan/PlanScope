evidence_conflicts:                     # 官方资料冲突留档，防每日 CI 被旧页面改回旧值
  - field: pricing.seats.minimum.value
    selected_value: 2
    selected_source: official_business_page
    conflicting_value: 5
    conflicting_source: official_api_overview
    resolution:
      reason: >-
        Kimi Business 专页与 Business FAQ 是专门文档，最近更新且与实际购买页一致；
        API 产品概览仍写「5 座起售」属旧文案未同步。以专页为准（2 席），
        保留冲突记录，后续 CI 抓到任一来源都不得无故回改。
      decided_at: "2026-09-23T00:00:00+08:00"

