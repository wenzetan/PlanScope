source_refs: []                    # sources.yaml 待补官方 URL 后建立引用
sources: []

notes: >-
  ① 年价官方未给 → annual.amount: null + origin: unknown，**不按 199×12 反推**
  （区别于 Andante/Moderato：那两档官方给了年付折合价）。
  ② 旧套餐体系内可升级（¥199 → ¥699 等），2026-07-20 官方公告区分新旧体系。
  ③ HighSpeed 自本档起可用：约 5–6× 输出速度、3× 额度消耗 —— 见 models.yaml
  speed_multiplier / quota_usage_multiplier。
  ④ Kimi Claw 云主机驻留约 0.6%/天、Agent Website 约 0.08%/天的额度消耗
  记录于 background_consumption。
  ⑤ 各来源 URL 待补（pricing / 公告 / 模型矩阵 / Claw 成本 / 接入文档）。
