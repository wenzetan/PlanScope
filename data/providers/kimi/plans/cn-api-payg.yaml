notes: >-
  ① record_kind: payg_baseline —— 官方明确开放平台**无订阅制 API Plan**，本记录是比较基线，
  不是 subscription；四条 API 记录（CN/Global × PAYG/Enterprise）都不与 Membership/Business 混类。
  ② 个人与普通企业认证用户 PAYG 同价 → 单一记录（audience: api，supported: individual+organization）；
  真正产生价格/SLA/限流/支持差异的是 Enterprise Contract（独立记录）。
  ③ 隐私事实（API input/output 不训练、不为训练持久化、ZDR unknown）统一记在
  privacy/api.yaml —— Training / Retention / ZDR 三个独立字段，不训练 ≠ ZDR。
  ④ CN 与 Global 报价分币种保存（CNY vs USD）；地区溢价比较（regional_price_ratio）
  是 derived analysis，只在展示层用 config/exchange_rate.yaml 计算，绝不回写。
  ⑤ 赠券 ≠ free tier：一次性、3 个月有效、K3 不可用。
  ⑥ 限流 tier 是账户属性不是 Plan —— 不建 API Tier 1/2/3 文件。
  ⑦ 开放平台余额预付；与 Membership / Kimi Code 的余额、key、权益、计费互不相通。
  ⑧ 各来源 URL 待补（platform.kimi.com 定价页 / 限流文档 / 隐私条款）。
